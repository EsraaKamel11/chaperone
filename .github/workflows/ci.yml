name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Secret scan
        run: python tools/scan_secrets.py
      - name: Static audit
        run: python tools/static_audit.py
      - name: Coverage map
        run: python tools/coverage_map.py
      # `tests/test_readme_claims.py` does execute this script, under `check=True`, and this comment
      # said the opposite for as long as that was untrue. The step stays because it runs before the
      # suite and names the failure: the script asserts the blocked tool was never entered, so a
      # regression that let the send through fails here as "Day-2 demo" rather than surfacing
      # further down as a documentation guard, which is the wrong place for a reader to start.
      - name: Day-2 demo
        run: python demo/day2.py
      # Same reasoning, and one clause more. Scene 2 asserts that a redraft which now passes still
      # rides to a human inside the handoff rather than transmitting, which is the regression that
      # would otherwise print a plausible line and exit 0.
      - name: Full demo, both scenes
        run: python demo/full.py
      # Runs the generator; it does NOT compare the output against the committed page, because that
      # comparison would assert every rate in it and design spec 9.6 admits invariants only. What
      # this catches is the generator failing to produce a document at all: a positional arm
      # selector raising IndexError, and a rate over an empty denominator raising TypeError, are
      # both crashes rather than wrong numbers, and both were live in this task's brief.
      - name: Results report generates
        run: python tools/report.py
      - name: Perturbation log generates
        run: python tools/perturbation_log.py
      # Third generator, and the one whose output the step below is most likely to catch: it owns
      # two spans of `README.md` and rewrites them from the tree. A renamed function or a call that
      # stopped being made raises here rather than leaving a picture that still looks right, and a
      # specification edited without regenerating leaves the page dirty and fails the diff.
      - name: Diagrams generate
        run: python tools/diagram.py
      # The generators above rewrite committed pages. Running them proved only that they do not
      # crash: a rate that moved regenerated `docs/RESULTS.md`, left the tree dirty, and CI still
      # exited 0 with a published document disagreeing with what produces it. This is not an
      # assertion about any rate -- design spec 9.6 admits invariants only -- it is the invariant
      # that a generated page and its generator agree, whatever the numbers are.
      - name: Generated pages match their generators
        run: git diff --exit-code
      - name: Tests
        run: pytest -v
      # After the suite, because the mutation sweep rewrites files under `src/` and restores them in
      # a `finally`. A run killed mid-sweep skips that restore, and the stranded mutant has twice
      # been a fail-open one. Green tests over a tree the sweep left modified is the one result that
      # must not be read as a pass.
      - name: Working tree is clean after the suite
        run: git diff --exit-code
