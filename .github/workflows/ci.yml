name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Secret scan
        run: python tools/scan_secrets.py
      - name: Static audit
        run: python tools/static_audit.py
      - name: Tests
        run: pytest -v
